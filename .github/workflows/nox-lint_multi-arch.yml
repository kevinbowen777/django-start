name: nox-lint_multi-arch
on: push
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    name: Python ${{ matrix.python-version }} django-start
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${PYTHON_VERSION}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          architecture: x64
      - run: pip install nox==2026.10.20
      - run: pip install poetry==2.5.1
      - run: pip install poetry-plugin-export==1.10.1
      - run: nox -s lint-${{ matrix.python-version }}
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOCIALACCOUNT_APP_CLIENT_ID: ${{ secrets.SOCIALACCOUNT_APP_CLIENT_ID }}
          SOCIALACCOUNT_APP_SECRET: ${{ secrets.SOCIALACCOUNT_APP_SECRET }}
